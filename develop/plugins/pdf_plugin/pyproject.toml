[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filetranscode-pdf-plugin"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "filetranscode",
    "pydantic>=2.0",
    "img2pdf>=0.5",
    "reportlab>=4.0",
    "pillow>=10.0",
]

[project.entry-points."filetranscode.plugins"]
pdf = "filetranscode_pdf_plugin"

[tool.setuptools.packages.find]
where = ["src"]
