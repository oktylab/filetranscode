[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filetranscode"
version = "0.1.0"
description = "A pluggable, typed pipeline engine for media (and any other file) processing"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "pillow-heif>=1.0",
    "numpy>=1.26",
    "pydantic>=2.0",
]

[project.optional-dependencies]
pyav = ["av>=12.0"]
moviepy = ["moviepy>=2.0"]
cli = ["jinja2>=3.1", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
filetranscode = "filetranscode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filetranscode = ["**/*.html", "**/*.css", "**/*.js"]
